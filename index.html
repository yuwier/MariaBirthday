<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Маше — 20</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Manrope:wght@400;500;600&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:   #170f26;
    --bg-mid:    #362350;
    --bg-mauve:  #7a4360;
    --coral:     #ff8f70;
    --gold:      #ffc978;
    --gold-soft: #ffe3b0;
    --cream:     #fff6ec;
    --lavender:  #cba9e0;
    --ease: cubic-bezier(.22,.75,.32,1);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html{ scroll-behavior:smooth; }

  body{
    font-family:'Manrope', sans-serif;
    background:var(--bg-deep);
    color:var(--cream);
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  ::selection{ background:var(--coral); color:var(--bg-deep); }

  a{ color:inherit; }

  button{
    font-family:inherit;
    cursor:pointer;
  }

  button:focus-visible,
  a:focus-visible{
    outline:2px solid var(--gold);
    outline-offset:4px;
  }

  .display{
    font-family:'Fraunces', serif;
  }

  .script{
    font-family:'Caveat', cursive;
  }

  /* ---------- HERO ---------- */

  .hero{
    position:relative;
    min-height:100svh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:8vh 6vw 12vh;
    overflow:hidden;
    background:linear-gradient(
      180deg,
      #12081f 0%,
      #241238 22%,
      #3d1f47 42%,
      #6b3452 62%,
      #b8586a 82%,
      #ff8f70 100%
    );
  }

  .stars{
    position:absolute;
    inset:0 0 45% 0;
    pointer-events:none;
  }

  .star{
    position:absolute;
    width:2px;
    height:2px;
    background:var(--cream);
    border-radius:50%;
    opacity:.7;
    animation:twinkle 4s ease-in-out infinite;
  }

  @keyframes twinkle{
    0%,100%{ opacity:.15; transform:scale(1); }
    50%{ opacity:.9; transform:scale(1.6); }
  }

  .horizon{
    position:absolute;
    left:0; right:0; bottom:0;
    height:38%;
    background:linear-gradient(180deg, rgba(255,143,112,0) 0%, rgba(255,201,120,.16) 100%);
    pointer-events:none;
  }

  .sun-wrap{
    position:relative;
    width:min(52vw, 300px);
    height:min(52vw, 300px);
    margin-bottom:2.2rem;
  }

  .sun-rays{
    position:absolute;
    inset:-30%;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,201,120,.35) 0%, rgba(255,201,120,0) 65%);
    animation:pulse 5s ease-in-out infinite;
  }

  @keyframes pulse{
    0%,100%{ transform:scale(1); opacity:.7; }
    50%{ transform:scale(1.12); opacity:1; }
  }

  .sun{
    position:absolute;
    inset:0;
    border-radius:50%;
    background:radial-gradient(circle at 38% 32%, var(--gold-soft), var(--gold) 45%, var(--coral) 100%);
    box-shadow:0 0 60px rgba(255,143,112,.55), 0 0 140px rgba(255,201,120,.35);
    display:flex;
    align-items:center;
    justify-content:center;
    animation:rise 1.6s var(--ease) both;
  }

  @keyframes rise{
    from{ transform:translateY(40px); opacity:0; }
    to{ transform:translateY(0); opacity:1; }
  }

  .sun-number{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:clamp(3.2rem, 13vw, 6.5rem);
    color:var(--bg-deep);
    line-height:1;
    letter-spacing:-0.02em;
  }

  .eyebrow{
    font-size:.78rem;
    letter-spacing:.42em;
    text-transform:uppercase;
    color:var(--gold-soft);
    opacity:.85;
    margin-bottom:.6rem;
    animation:fadeUp 1s var(--ease) .3s both;
  }

  .hero-name{
    font-size:clamp(3rem, 11vw, 6.4rem);
    font-weight:500;
    font-style:italic;
    line-height:1;
    color:var(--cream);
    text-shadow:0 4px 40px rgba(0,0,0,.25);
    animation:fadeUp 1.1s var(--ease) .5s both;
  }

  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(18px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .scroll-cue{
    position:absolute;
    bottom:5vh;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:.5rem;
    font-size:.7rem;
    letter-spacing:.28em;
    text-transform:uppercase;
    color:var(--bg-deep);
    opacity:.75;
    animation:fadeUp 1s var(--ease) 1.1s both;
  }

  .scroll-cue .line{
    width:1px;
    height:34px;
    background:var(--bg-deep);
    opacity:.6;
    animation:scrollLine 2s ease-in-out infinite;
  }

  @keyframes scrollLine{
    0%{ transform:scaleY(0); transform-origin:top; }
    45%{ transform:scaleY(1); transform-origin:top; }
    55%{ transform:scaleY(1); transform-origin:bottom; }
    100%{ transform:scaleY(0); transform-origin:bottom; }
  }

  /* ---------- MESSAGE ---------- */

  .message{
    position:relative;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:14vh 7vw;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(255,143,112,.14) 0%, rgba(255,143,112,0) 55%),
      linear-gradient(180deg, #241238 0%, #170f26 55%, #12081f 100%);
  }

  .message-inner{
    max-width:760px;
  }

  .message-mark{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:clamp(2.4rem, 5vw, 3.2rem);
    color:var(--coral);
    opacity:.55;
    display:block;
    margin-bottom:1.2rem;
  }

  .message-text{
    font-family:'Fraunces', serif;
    font-weight:400;
    font-style:italic;
    font-size:clamp(1.6rem, 4.2vw, 2.7rem);
    line-height:1.5;
    color:var(--cream);
  }

  .message-text .word{
    display:inline-block;
    opacity:0;
    filter:blur(6px);
    transform:translateY(14px);
    transition:opacity .7s var(--ease), transform .7s var(--ease), filter .7s var(--ease);
  }

  .message-text .word.in{
    opacity:1;
    transform:translateY(0);
    filter:blur(0);
  }

  .message-text .accent{
    color:var(--gold);
    font-style:normal;
    font-weight:500;
  }

  .message-divider{
    width:64px;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
    margin:2.6rem auto 0;
    opacity:0;
    transition:opacity 1s var(--ease) .3s;
  }

  .message-divider.in{ opacity:.8; }

  /* ---------- GALLERY ---------- */

  .gallery-section{
    position:relative;
    padding:16vh 7vw 18vh;
    background:#12081f;
    overflow:hidden;
  }

  .gallery-heading{
    text-align:center;
    margin-bottom:9vh;
  }

  .gallery-heading .eyebrow{
    color:var(--lavender);
    animation:none;
    opacity:.8;
  }

  .gallery-heading h2{
    font-family:'Fraunces', serif;
    font-weight:400;
    font-style:italic;
    font-size:clamp(2rem, 5vw, 3rem);
    margin-top:.4rem;
  }

  .polaroid-grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:2.4rem 1.6rem;
    max-width:1080px;
    margin:0 auto;
  }

  .polaroid{
    background:var(--cream);
    padding:.7rem .7rem 2.2rem;
    border-radius:2px;
    box-shadow:0 18px 40px rgba(0,0,0,.35);
    opacity:0;
    transform:translateY(40px) rotate(var(--r,0deg));
    transition:opacity .8s var(--ease), transform .8s var(--ease);
  }

  .polaroid.in{
    opacity:1;
    transform:translateY(0) rotate(var(--r,0deg));
  }

  .polaroid:nth-child(1){ --r:-6deg; }
  .polaroid:nth-child(2){ --r:4deg; margin-top:2.4rem; }
  .polaroid:nth-child(3){ --r:-3deg; margin-top:-1rem; }
  .polaroid:nth-child(4){ --r:5deg; margin-top:1.2rem; }

  .polaroid:hover{
    transform:translateY(-8px) rotate(0deg) scale(1.04);
    transition:transform .35s var(--ease);
    z-index:2;
  }

  .polaroid .frame{
    position:relative;
    width:100%;
    aspect-ratio:4/5;
    overflow:hidden;
    background:linear-gradient(135deg, #3d1f47, #6b3452);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .polaroid .frame img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .polaroid .fallback-heart{
    color:rgba(255,246,236,.5);
    font-size:2rem;
  }

  /* ---------- CLOSING ---------- */

  .closing{
    position:relative;
    min-height:60vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:1.4rem;
    padding:10vh 6vw;
    background:linear-gradient(180deg, #12081f 0%, #1c0f2c 100%);
  }

  .closing-number{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:300;
    font-size:clamp(4rem, 16vw, 9rem);
    line-height:1;
    background:linear-gradient(135deg, var(--gold-soft), var(--coral));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    opacity:0;
    transform:scale(.9);
    transition:opacity 1s var(--ease), transform 1s var(--ease);
  }

  .closing-number.in{ opacity:1; transform:scale(1); }

  .closing-sign{
    font-family:'Caveat', cursive;
    font-size:1.6rem;
    color:var(--lavender);
    opacity:0;
    transition:opacity 1s var(--ease) .2s;
  }

  .closing-sign.in{ opacity:.9; }

  /* ---------- SUN INTERACTION ---------- */

  .sun-wrap{ cursor:pointer; }

  .wish-tooltip{
    position:absolute;
    top:-2.6rem;
    left:50%;
    transform:translateX(-50%) translateY(4px);
    white-space:nowrap;
    font-size:.72rem;
    letter-spacing:.24em;
    text-transform:uppercase;
    color:var(--bg-deep);
    background:var(--gold-soft);
    padding:.5rem 1rem;
    border-radius:999px;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s var(--ease), transform .3s var(--ease);
  }

  .sun-wrap:hover .wish-tooltip,
  .sun-wrap:focus-visible .wish-tooltip{
    opacity:.95;
    transform:translateX(-50%) translateY(0);
  }

  .sun.pulse-hit{
    animation:sunHit .6s var(--ease);
  }

  @keyframes sunHit{
    0%{ box-shadow:0 0 60px rgba(255,143,112,.55), 0 0 140px rgba(255,201,120,.35); }
    35%{ box-shadow:0 0 110px rgba(255,201,120,.9), 0 0 240px rgba(255,201,120,.6); transform:scale(1.06); }
    100%{ box-shadow:0 0 60px rgba(255,143,112,.55), 0 0 140px rgba(255,201,120,.35); transform:scale(1); }
  }

  .wish-particle{
    position:fixed;
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--gold-soft);
    pointer-events:none;
    z-index:40;
    animation:wishRise 1.4s var(--ease) forwards;
  }

  @keyframes wishRise{
    0%{ opacity:1; transform:translate(0,0) scale(1); }
    100%{ opacity:0; transform:var(--drift) scale(.3); }
  }

  .sky-hint{
    position:absolute;
    bottom:5vh;
    left:6vw;
    font-size:.68rem;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--cream);
    opacity:.45;
    transition:opacity .6s var(--ease);
    animation:fadeUp 1s var(--ease) 1.4s both;
  }

  .sky-hint.hidden{ opacity:0; }

  /* ---------- SHOOTING STARS ---------- */

  .shooting-star{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:var(--cream);
    pointer-events:none;
    z-index:5;
    box-shadow:
      0 0 6px 1px rgba(255,246,236,.9),
      -60px 12px 14px -6px rgba(255,246,236,.35);
    animation:shoot 1.1s ease-out forwards;
  }

  @keyframes shoot{
    0%{ opacity:0; transform:translate(0,0) rotate(28deg) scaleX(1); }
    10%{ opacity:1; }
    100%{ opacity:0; transform:translate(-320px, 170px) rotate(28deg) scaleX(1); }
  }

  /* ---------- GALLERY LIGHTBOX ---------- */

  .polaroid .frame{ cursor:zoom-in; }

  .lightbox{
    position:fixed;
    inset:0;
    background:rgba(10,5,18,.88);
    backdrop-filter:blur(6px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:6vh 6vw;
    opacity:0;
    pointer-events:none;
    transition:opacity .35s var(--ease);
    z-index:100;
  }

  .lightbox.open{
    opacity:1;
    pointer-events:auto;
  }

  .lightbox img{
    max-width:min(560px, 86vw);
    max-height:80vh;
    border-radius:3px;
    box-shadow:0 30px 80px rgba(0,0,0,.5);
    transform:scale(.92);
    transition:transform .35s var(--ease);
  }

  .lightbox.open img{ transform:scale(1); }

  .lightbox-close{
    position:absolute;
    top:4vh;
    right:5vw;
    width:44px;
    height:44px;
    border-radius:50%;
    border:1px solid rgba(255,246,236,.35);
    background:rgba(255,246,236,.06);
    color:var(--cream);
    font-size:1.2rem;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .25s var(--ease), transform .25s var(--ease);
  }

  .lightbox-close:hover{
    background:rgba(255,246,236,.16);
    transform:rotate(90deg);
  }

  /* ---------- CLOSING / FIREWORKS ---------- */

  .closing{
    align-items:center;
    justify-content:center;
  }

  .closing-stage{
    position:relative;
    width:min(90vw, 640px);
    height:min(60vh, 420px);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  #fireworksCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
  }

  .firework-btn{
    position:relative;
    z-index:2;
    display:inline-flex;
    align-items:center;
    gap:.6rem;
    padding:.9rem 1.9rem;
    border-radius:999px;
    border:1px solid rgba(255,201,120,.5);
    background:rgba(255,201,120,.08);
    color:var(--gold-soft);
    font-size:.78rem;
    letter-spacing:.24em;
    text-transform:uppercase;
    transition:background .3s var(--ease), transform .3s var(--ease), border-color .3s var(--ease);
  }

  .firework-btn:hover{
    background:rgba(255,201,120,.18);
    border-color:var(--gold);
    transform:translateY(-2px);
  }

  .firework-btn:active{ transform:translateY(0) scale(.97); }

  .firework-btn .spark{ font-size:1rem; }

  /* ---------- REDUCED MOTION ---------- */

  @media (prefers-reduced-motion: reduce){
    *{
      animation-duration:.01ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.01ms !important;
      scroll-behavior:auto !important;
    }
  }

  /* ---------- RESPONSIVE ---------- */

  @media (max-width:820px){
    .polaroid-grid{
      grid-template-columns:repeat(2, 1fr);
    }
    .polaroid:nth-child(2){ margin-top:2.4rem; }
    .polaroid:nth-child(3){ margin-top:0; }
  }

  @media (max-width:480px){
    .polaroid-grid{ gap:1.6rem 1rem; }
    .message-text{ font-size:1.5rem; }
  }
</style>
</head>
<body>

  <!-- ===== HERO ===== -->
  <section class="hero">
    <div class="stars" id="stars"></div>
    <div class="horizon"></div>

    <div class="sun-wrap" id="sunWrap" role="button" tabindex="0" aria-label="Загадать желание">
      <span class="wish-tooltip">Загадай желание</span>
      <div class="sun-rays"></div>
      <div class="sun" id="sun">
        <span class="sun-number">20</span>
      </div>
    </div>

    <p class="eyebrow">двадцать лет</p>
    <h1 class="hero-name display">Маша</h1>

    <div class="scroll-cue">
      <span>Пролистай</span>
      <span class="line"></span>
    </div>

    <p class="sky-hint" id="skyHint">✦ нажми на небо</p>
  </section>

  <!-- ===== MESSAGE ===== -->
  <section class="message">
    <div class="message-inner">
      <span class="message-mark">&ldquo;</span>
      <p class="message-text" id="messageText"></p>
      <div class="message-divider" id="messageDivider"></div>
    </div>
  </section>

  <!-- ===== GALLERY ===== -->
  <section class="gallery-section">
    <div class="gallery-heading">
      <p class="eyebrow">на память</p>
      <h2>Мгновения</h2>
    </div>

    <div class="polaroid-grid" id="polaroidGrid">
      <figure class="polaroid">
        <div class="frame" tabindex="0" role="button" aria-label="Открыть фото">
          <img src="image1.jpg" alt="" onerror="this.style.display='none'; this.parentElement.innerHTML='<span class=&quot;fallback-heart&quot;>&#9825;</span>'; this.parentElement.removeAttribute('tabindex');">
        </div>
      </figure>
      <figure class="polaroid">
        <div class="frame" tabindex="0" role="button" aria-label="Открыть фото">
          <img src="image2.jpg" alt="" onerror="this.style.display='none'; this.parentElement.innerHTML='<span class=&quot;fallback-heart&quot;>&#9825;</span>'; this.parentElement.removeAttribute('tabindex');">
        </div>
      </figure>
      <figure class="polaroid">
        <div class="frame" tabindex="0" role="button" aria-label="Открыть фото">
          <img src="image3.jpg" alt="" onerror="this.style.display='none'; this.parentElement.innerHTML='<span class=&quot;fallback-heart&quot;>&#9825;</span>'; this.parentElement.removeAttribute('tabindex');">
        </div>
      </figure>
      <figure class="polaroid">
        <div class="frame" tabindex="0" role="button" aria-label="Открыть фото">
          <img src="image4.jpg" alt="" onerror="this.style.display='none'; this.parentElement.innerHTML='<span class=&quot;fallback-heart&quot;>&#9825;</span>'; this.parentElement.removeAttribute('tabindex');">
        </div>
      </figure>
    </div>
  </section>

  <!-- ===== LIGHTBOX ===== -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-hidden="true">
    <button class="lightbox-close" id="lightboxClose" aria-label="Закрыть">&times;</button>
    <img id="lightboxImg" src="" alt="Увеличенное фото">
  </div>

  <!-- ===== CLOSING ===== -->
  <section class="closing">
    <div class="closing-stage">
      <canvas id="fireworksCanvas"></canvas>
      <div class="closing-number" id="closingNumber">20</div>
    </div>
    <button class="firework-btn" id="fireworkBtn">
      <span class="spark">✨</span> Зажечь салют
    </button>
  </section>

<script>
  // ---- generate stars ----
  const starsWrap = document.getElementById('stars');
  const STAR_COUNT = 46;
  for(let i=0;i<STAR_COUNT;i++){
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random()*100 + '%';
    s.style.top = Math.random()*70 + '%';
    s.style.animationDelay = (Math.random()*4) + 's';
    s.style.animationDuration = (3 + Math.random()*3) + 's';
    starsWrap.appendChild(s);
  }

  // ---- build the message word-by-word ----
  const RAW_MESSAGE = "Маша, желаю тебе самой яркой, легкой и наполненной жизни. Пусть исполняются мечты";
  const ACCENT_WORDS = new Set(['яркой,', 'легкой', 'наполненной', 'мечты']);

  const messageEl = document.getElementById('messageText');
  RAW_MESSAGE.split(' ').forEach((word, i) => {
    const span = document.createElement('span');
    span.className = 'word' + (ACCENT_WORDS.has(word.replace('.', '')) ? ' accent' : '');
    span.textContent = word;
    span.style.transitionDelay = (i * 70) + 'ms';
    messageEl.appendChild(span);
    messageEl.appendChild(document.createTextNode(' '));
  });

  // ---- scroll reveal ----
  const revealTargets = [
    ...document.querySelectorAll('.word'),
    document.getElementById('messageDivider'),
    ...document.querySelectorAll('.polaroid'),
    document.getElementById('closingNumber'),
  ];

  const io = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if(entry.isIntersecting){
        entry.target.classList.add('in');
        io.unobserve(entry.target);
      }
    });
  }, { threshold: 0.35 });

  revealTargets.forEach(el => io.observe(el));

  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---- wish particles on the sun ----
  const sunWrap = document.getElementById('sunWrap');
  const sun = document.getElementById('sun');
  const skyHint = document.getElementById('skyHint');

  function makeWish(originEl){
    const rect = originEl.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;

    sun.classList.remove('pulse-hit');
    void sun.offsetWidth; // restart animation
    sun.classList.add('pulse-hit');

    const count = prefersReducedMotion ? 0 : 14;
    for(let i = 0; i < count; i++){
      const p = document.createElement('span');
      p.className = 'wish-particle';
      const angle = (Math.PI * 2 * i) / count + Math.random() * 0.4;
      const dist = 90 + Math.random() * 140;
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist - 60;
      p.style.setProperty('--drift', `translate(${dx}px, ${dy}px)`);
      p.style.left = cx + 'px';
      p.style.top = cy + 'px';
      p.style.background = i % 2 === 0 ? 'var(--gold-soft)' : 'var(--coral)';
      document.body.appendChild(p);
      p.addEventListener('animationend', () => p.remove());
    }
  }

  sunWrap.addEventListener('click', () => makeWish(sun));
  sunWrap.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      makeWish(sun);
    }
  });

  // ---- shooting stars ----
  const hero = document.querySelector('.hero');

  function spawnShootingStar(x, y){
    if(prefersReducedMotion) return;
    const star = document.createElement('div');
    star.className = 'shooting-star';
    star.style.left = x + 'px';
    star.style.top = y + 'px';
    hero.appendChild(star);
    star.addEventListener('animationend', () => star.remove());
  }

  hero.addEventListener('click', (e) => {
    if(sunWrap.contains(e.target)) return;
    if(e.target.closest('.scroll-cue')) return;
    const heroRect = hero.getBoundingClientRect();
    spawnShootingStar(e.clientX - heroRect.left, e.clientY - heroRect.top);
    if(skyHint) skyHint.classList.add('hidden');
  });

  if(!prefersReducedMotion){
    setInterval(() => {
      const heroRect = hero.getBoundingClientRect();
      if(heroRect.bottom < 0 || heroRect.top > window.innerHeight) return;
      spawnShootingStar(
        Math.random() * heroRect.width * 0.7 + heroRect.width * 0.15,
        Math.random() * heroRect.height * 0.35
      );
    }, 4200);
  }

  // ---- gallery lightbox ----
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const lightboxClose = document.getElementById('lightboxClose');

  document.getElementById('polaroidGrid').addEventListener('click', (e) => {
    const frame = e.target.closest('.frame');
    if(!frame) return;
    const img = frame.querySelector('img');
    if(!img) return; // fallback heart, nothing to zoom
    lightboxImg.src = img.src;
    lightbox.classList.add('open');
    lightbox.setAttribute('aria-hidden', 'false');
  });

  document.getElementById('polaroidGrid').addEventListener('keydown', (e) => {
    if((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('frame')){
      e.preventDefault();
      e.target.click();
    }
  });

  function closeLightbox(){
    lightbox.classList.remove('open');
    lightbox.setAttribute('aria-hidden', 'true');
  }

  lightboxClose.addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (e) => {
    if(e.target === lightbox) closeLightbox();
  });
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape') closeLightbox();
  });

  // ---- closing fireworks ----
  const canvas = document.getElementById('fireworksCanvas');
  const ctx = canvas.getContext('2d');
  const fireworkBtn = document.getElementById('fireworkBtn');
  let fwParticles = [];
  let fwRunning = false;
  const FW_COLORS = ['#ffe3b0', '#ffc978', '#ff8f70', '#cba9e0', '#fff6ec'];

  function resizeCanvas(){
    const stage = canvas.parentElement.getBoundingClientRect();
    canvas.width = stage.width;
    canvas.height = stage.height;
  }

  function burst(cx, cy){
    const count = prefersReducedMotion ? 18 : 42;
    for(let i = 0; i < count; i++){
      const angle = (Math.PI * 2 * i) / count + Math.random() * 0.2;
      const speed = 2 + Math.random() * 3.4;
      fwParticles.push({
        x: cx, y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        decay: 0.012 + Math.random() * 0.01,
        color: FW_COLORS[Math.floor(Math.random() * FW_COLORS.length)],
        size: 1.5 + Math.random() * 2
      });
    }
    if(!fwRunning) animateFireworks();
  }

  function animateFireworks(){
    fwRunning = true;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    fwParticles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.045;
      p.vx *= 0.99;
      p.life -= p.decay;
      ctx.globalAlpha = Math.max(p.life, 0);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    fwParticles = fwParticles.filter(p => p.life > 0);

    if(fwParticles.length > 0){
      requestAnimationFrame(animateFireworks);
    } else {
      fwRunning = false;
    }
  }

  function launchFireworks(){
    resizeCanvas();
    const w = canvas.width, h = canvas.height;
    burst(w * 0.3, h * 0.35);
    setTimeout(() => burst(w * 0.7, h * 0.28), 220);
    setTimeout(() => burst(w * 0.5, h * 0.5), 440);
  }

  fireworkBtn.addEventListener('click', launchFireworks);
  window.addEventListener('resize', resizeCanvas);

  const closingSection = document.querySelector('.closing');
  const closingObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if(entry.isIntersecting){
        setTimeout(launchFireworks, 500);
        closingObserver.unobserve(entry.target);
      }
    });
  }, { threshold: 0.5 });
  closingObserver.observe(closingSection);
</script>
</body>
</html>
