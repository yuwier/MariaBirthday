<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Маша — 20 ✨</title>


<style>

@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@300;400;600&display=swap');


*{
box-sizing:border-box;
}


body{

margin:0;
overflow-x:hidden;

font-family:Montserrat,sans-serif;

background:
radial-gradient(circle at top,#5c476d,#21172d 60%,#090711);

color:white;

}


/* ===== ЗВЕЗДЫ ===== */


.stars{

position:fixed;
inset:0;

background-image:
radial-gradient(#fff 1px,transparent 2px);

background-size:
50px 50px;

opacity:.4;

animation:
moveStars 20s linear infinite;

}



@keyframes moveStars{

from{
transform:translateY(0);
}

to{
transform:translateY(-200px);
}

}



/* ===== ПЕРВЫЙ ЭКРАН ===== */


.intro{

height:100vh;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

text-align:center;

padding:30px;

}


.big20{


font-family:
"Cormorant Garamond";

font-size:180px;

line-height:1;

background:
linear-gradient(#fff,#f7c9d9,#e6a85e);

-webkit-background-clip:text;

color:transparent;


animation:
shine 3s infinite alternate;


}



@keyframes shine{

from{
filter:
drop-shadow(0 0 10px #fff);
}

to{
filter:
drop-shadow(0 0 40px #f7c9d9);
}

}



.intro p{

font-size:18px;

opacity:.8;

}



.open{


margin-top:40px;

padding:18px 35px;

border-radius:50px;

border:1px solid rgba(255,255,255,.3);

background:
rgba(255,255,255,.15);

color:white;

font-size:16px;

backdrop-filter:blur(20px);

}



/* ===== ОСНОВНОЙ САЙТ ===== */


.page{

display:none;

padding:30px 20px 80px;

animation:
fade 1.5s;

}



@keyframes fade{

from{
opacity:0;
transform:translateY(50px);
}

to{
opacity:1;
}

}




.card{


background:
rgba(255,255,255,.12);

border:
1px solid rgba(255,255,255,.2);

backdrop-filter:blur(20px);

border-radius:35px;

padding:35px 25px;

text-align:center;

box-shadow:
0 20px 60px rgba(0,0,0,.3);


}



.title{

font-family:
"Cormorant Garamond";

font-size:45px;

margin:0;

}



.text{

font-size:19px;

line-height:1.7;

min-height:130px;

}




/* ===== СЕРДЦА ===== */


.heart{

position:fixed;

pointer-events:none;

font-size:20px;

animation:
fly 2s forwards;

}



@keyframes fly{

to{

transform:
translateY(-400px)
scale(2);

opacity:0;

}

}




/* ===== ФОТО ===== */


.gallery{

margin-top:50px;

}



.gallery h2{

font-family:
"Cormorant Garamond";

font-size:40px;

text-align:center;

}



.photos{


display:grid;

grid-template-columns:repeat(2,1fr);

gap:15px;


}



.photos img{


width:100%;

height:180px;

object-fit:cover;

border-radius:25px;


box-shadow:
0 15px 40px rgba(0,0,0,.4);


transition:.4s;


}



.photos img:hover{

transform:
scale(1.05);

}





.final{


margin-top:70px;

height:300px;

display:flex;

justify-content:center;

align-items:center;

text-align:center;


}



.final span{


font-family:
"Cormorant Garamond";

font-size:70px;

background:
linear-gradient(#fff,#ffd59a);

-webkit-background-clip:text;

color:transparent;

}




</style>


</head>


<body>



<div class="stars"></div>



<section class="intro" id="intro">


<div class="big20">
20
</div>


<p>
Одна маленькая цифра.<br>
Огромная новая глава ✨
</p>



<button class="open" onclick="openCard()">

Тык

</button>


</section>





<main class="page" id="page">


<div class="card">


<h1 class="title">

С днем рождения ✨

</h1>


<p class="text" id="typing"></p>


</div>





<section class="gallery">


<h2>
😊
</h2>


<div class="photos">


<img src="image1.jpg">

<img src="image2.jpg">

<img src="image3.jpg">

<img src="image4.jpg">


</div>


</section>





<section class="final">

<span>
Поздравляю
<br>
С 20-летием ✨
</span>

</section>



</main>







<script>


function openCard(){


document.getElementById("intro").style.display="none";


document.getElementById("page").style.display="block";


typeText();


}




const text =
"Маша, желаю тебе самой яркой, легкой и наполненной жизни. Пусть исполняются мечты";



let i=0;



function typeText(){


if(i<text.length){


document.getElementById("typing").innerHTML += text[i];


i++;


setTimeout(typeText,45);


}


}






document.addEventListener(
"click",
function(e){


for(let j=0;j<6;j++){


let h=document.createElement("div");


h.className="heart";

h.innerHTML="✨";


h.style.left=e.clientX+"px";

h.style.top=e.clientY+"px";


h.style.animationDelay=
Math.random()+"s";


document.body.appendChild(h);



setTimeout(()=>{

h.remove();

},2000);



}


}

);



</script>


</body>
</html>
